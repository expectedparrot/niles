[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "niles"
version = "0.1.0"
description = "Local-first CRM CLI with EDSL-powered surveys and intake"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Expected Parrot" }
]
dependencies = []

[project.optional-dependencies]
edsl = ["edsl"]
spreadsheet = ["openpyxl>=3.1"]
test = ["pytest", "pytest-cov", "openpyxl>=3.1"]

[project.scripts]
niles = "niles.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
